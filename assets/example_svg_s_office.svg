<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Example: rounded square + negative-space S (office / screen imagery)
    Module w = 74 (width of the S channels)
    Square 540×540, corner radius 60; the three horizontal S channels have center lines at y = 357 / 500 / 643 (spacing 143)
    S corners are arcs of radius 50 on the center line; the whole shape has 180° central symmetry
    Boolean operation: square − S channels (the black parts of the mask are cut away)
  -->
  <rect id="bg" width="1024" height="1024" fill="#F7F7F5"/>
  <defs>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <path d="M 666 357 H 423 A 50 50 0 0 0 373 407 V 450 A 50 50 0 0 0 423 500 H 599 A 50 50 0 0 1 649 550 V 593 A 50 50 0 0 1 599 643 H 356"
            fill="none" stroke="#000" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g id="skeleton" fill="#1A1A1A">
    <rect x="242" y="242" width="540" height="540" rx="60" mask="url(#cut)"/>
  </g>
</svg>
